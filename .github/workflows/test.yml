# 自动跑测试：推送到任何分支都跑；推送到 main 时由「发布网站」先调用这里，测试不过就不发布
# 只跑不需要真实数据的几套（真实数据在仓库外面，全套在本地用 tests/run_all.sh）
name: 测试
on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 用 runner 自带的 Chrome（/usr/bin/google-chrome），不用下载 Playwright 的浏览器
      - run: pip install playwright==1.63.0 && google-chrome --version
      - name: 没网记账 + 编辑预定 + 回头客
        run: python tests/test_offline_resv.py
      - name: 增量同步 / 两台手机
        run: python tests/test_sync.py
      - name: 真 Firestore SDK 断网
        run: python tests/test_realsdk.py
      - name: 读不到数据时不当成「没有」（数据结构版本 / 迁移）
        run: python tests/test_v2_failsafe.py
      - name: v2 边角情况（系列订货到货分口味、认不出的记录不丢、撤销结账的空指针）+ 随机写入压力测试
        run: node tests/v2_cases.js
      - name: 镜像页（Claude 里看 App 界面）：数字跟手机 App 一样、只读、增量同步
        run: python tests/test_mirror.py
      - name: 对账单改往来单价（旧结构 / 新结构）
        run: python tests/test_xfer_price.py
      - name: 合伙人对账同系列互抵（旧结构 / 新结构）
        run: python tests/test_offset.py
      - name: 备份 → 弄坏 → 从备份恢复 → 账一模一样（旧结构 / 新结构）
        run: python tests/test_restore.py
      - name: 预定的货拿到后改预定 / 取消预定，欠合伙人的不丢（旧结构 / 新结构）
        run: python tests/test_resv_release.py
      - name: 有新版提示（版本号两处一致、线上变了才提示）
        run: python tests/test_update.py
      - name: 打开要快、读到一半不显示（test_fast_start）
        run: python tests/test_fast_start.py
      - name: 口味排行、客户名字候选（旧结构 / 新结构）
        run: python tests/test_rank.py
      - name: 财务每周（旧结构 / 新结构）
        run: python tests/test_weeks.py
      - name: 客人少给 / 多给（旧结构 / 新结构）
        run: python tests/test_cust_bal.py
      - name: 付款方式统一（现金+转账）+ 订货单一起改
        run: python tests/test_pay_mix.py
      - name: 预定备注写在概览上、客户资料不填区
        run: python tests/test_resv_note.py
      - name: 打开先用上次存的数据、复制口味在标题右边
        run: python tests/test_snapshot.py
      - name: 跟进往后排、按节奏自动提醒、客户买过什么竖着排
        run: python tests/test_followup.py
      - name: 预定卡片上配送 / 自取小标签
        run: python tests/test_handoff.py
      - name: 预定交货时间、按时间排
        run: python tests/test_meet.py
      - name: 客人多给：原因、送我的不用还
        run: python tests/test_gift.py
      - name: 合伙人名字按钮不重复
        run: python tests/test_pnames.py
      - name: 成本账：卖出早于进货时先欠着、下一批补上
        run: python tests/test_fifo_gap.py
      - name: 复制口味带售价、价钱从低到高
        run: python tests/test_copy_flavours.py
      - name: 订货单点口味 + 粘贴清单识别
        run: node tests/orderparse_test.js && python tests/test_po_quick.py
      - name: 弹出页锁住后面的页面、不自动弹日期；订货日期默认今天
        run: python tests/test_sheet.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 测试截图
          path: tests/shots/
